name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR is opened by the Actions token, and such PRs trigger no
  # workflows, so its required checks would never run. A workflow_dispatch from
  # the same token does run, on the PR's head commit.
  release-pr-checks:
    needs: release-please
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run CI on the open release PR
        run: |
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')"
          if [ -n "$branch" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Attach the skill archive to the release
        run: |
          tar -czf "dead-weight-tests-$TAG.tar.gz" -C skills dead-weight-tests
          gh release upload "$TAG" "dead-weight-tests-$TAG.tar.gz" --clobber
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # skills.sh has no upload step: it lists public GitHub repos from `skills add` install telemetry.
      # This install is the release smoke test, and it is the event that lists the release on skills.sh.
      - name: Install from GitHub with the skills CLI
        run: |
          cd "$(mktemp -d)"
          npx -y skills@1.7.0 add "$GITHUB_REPOSITORY" --skill dead-weight-tests --agent claude-code --yes
          grep -q "version: \"${TAG#v}\"" .claude/skills/dead-weight-tests/SKILL.md
      - name: Install from the release archive
        run: |
          cd "$(mktemp -d)"
          DISABLE_TELEMETRY=1 npx -y skills@1.7.0 add \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dead-weight-tests-$TAG.tar.gz" \
            --agent claude-code --yes
          test -f .claude/skills/dead-weight-tests/SKILL.md
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dwd from the tag
        run: |
          cargo install --locked --git "https://github.com/$GITHUB_REPOSITORY" --tag "$TAG" dead-weight-tests
          dwd --version | tee version.txt
          grep -q "^dwd ${TAG#v}$" version.txt

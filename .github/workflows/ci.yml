name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests, clippy, skill discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain and components from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The skills CLI discovers the skill
        run: |
          DISABLE_TELEMETRY=1 npx -y skills@1.7.0 add . --list | tee list.txt
          grep -q 'dead-weight-tests' list.txt

  end-to-end:
    name: Collect and analyze the fixture crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same dev shell as `nix develop` / direnv locally.
      - uses: cachix/install-nix-action@v31
      - name: Find the planted dead weight in dwd-fixture
        run: nix develop --command cargo test --test fixture_e2e -- --ignored

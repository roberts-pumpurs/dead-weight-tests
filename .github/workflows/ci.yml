name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests, shellcheck, skill discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Analyzer unit tests
        run: python -m unittest discover -s tests -v
      - name: Shellcheck
        run: shellcheck skills/dead-weight-tests/scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The skills CLI discovers the skill
        run: |
          DISABLE_TELEMETRY=1 npx -y skills@1.7.0 add . --list | tee list.txt
          grep -q 'dead-weight-tests' list.txt

  end-to-end:
    name: Collect and analyze the fixture crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Find the planted dead weight
        working-directory: tests/fixture
        run: |
          ../../skills/dead-weight-tests/scripts/collect.sh -- --workspace
          python3 ../../skills/dead-weight-tests/scripts/analyze.py target/coverage/per-test/tests \
            --out target/coverage/per-test/report.md \
            --json target/coverage/per-test/candidates.json \
            --html target/coverage/per-test/report.html
          python3 ../check_fixture.py

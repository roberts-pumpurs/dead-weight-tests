[package]
name = "dead-weight-tests"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Find redundant Rust tests from per-test region coverage collected with cargo-nextest"
license = "MIT"
repository = "https://github.com/roberts-pumpurs/dead-weight-tests"
publish = false

[workspace]
# dwd-fixture holds planted dead weight for tests/fixture_e2e.rs.
members = ["fixture"]

[[bin]]
name = "dwd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
humantime = "2.4.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.1"
thiserror = "2.0.21"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
